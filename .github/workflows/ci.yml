name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is first-class: the web folder picker, drive browsing and
        # path handling all have Windows-only code paths and tests.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # postinstall generates the Prisma client; the SQLite schema is created
      # on first use, so no database setup is needed.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run web:build

      - run: bun test
